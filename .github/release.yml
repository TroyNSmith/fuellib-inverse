name: release

on: 
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    Version-Bump:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Install UV
              uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
              with:
                version: "0.12.6"
            
            - name: Set up Python
              run: uv python install